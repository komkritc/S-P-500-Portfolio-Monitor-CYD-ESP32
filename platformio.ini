; ESP32-CYD-SP500 — S&P 500 Portfolio Monitor for the ESP32 Cheap Yellow Display
; Hardware config (TFT flags, touch pins, partitions) copied from the proven
; esp32cyd-claude-monitor environment. Connected board measures 4 MB flash.

[platformio]
src_dir = .
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.2.0
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200   ; this CYD's CH340 drops the sync at 921600
; Dual OTA app slots + LittleFS storage, all inside 4 MB flash
; (nvs 0x9000, otadata 0xe000, ota_0 0x10000/1.5625M, ota_1 0x1A0000/1.5625M,
;  spiffs 0x330000/832K -> ends exactly at 0x400000; label must be "spiffs"
;  for core 2.0.17's LittleFS partition lookup)
board_build.partitions = partitions.csv
board_build.flash_mode = dio
build_flags =
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT
	; so the .ino finds the module headers in src/
	-Isrc
	; XPT2046 touch CS of the CYD (touch runs on its own VSPI bus, see TouchUI)
	-DTOUCH_CS=33
build_src_filter = +<*> -<data/> -<tests/>

[env:cyd]
build_flags =
	${env.build_flags}
	-DILI9341_2_DRIVER

[env:cyd_ota]
; Network upload once the device is on Wi-Fi:
;   pio run -e cyd_ota -t upload --upload-port sp500-32.local
; (sp500.local is the ESP8266 SmallTV on the same LAN: never flash this firmware there)
; (the upload password is the Settings admin password; empty = no auth)
extends = env:cyd
upload_protocol = espota
upload_port = sp500-32.local
